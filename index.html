<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Village - Photo Polaroid Printer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="app-header">
            <div class="brand">
                <h1>📷 Print Village</h1>
                <p>Print your memories</p>
            </div>
            <div class="header-actions">
                <button id="saveBtn" class="secondary">💾 Save Layout</button>
                <button id="printBtn" class="primary">🖨 Print</button>
            </div>
        </header>

        <aside class="sidebar sidebar-settings">
            <section class="panel">
                <h3>Paper</h3>
                <div class="control-group">
                    <label>Paper Size</label>
                    <select id="paperSize">
                        <optgroup label="Standard">
                            <option value="a4">A4 — 21 × 29.7 cm</option>
                            <option value="a3">A3 — 29.7 × 42 cm</option>
                            <option value="a5">A5 — 14.8 × 21 cm</option>
                            <option value="a6">A6 — 10.5 × 14.8 cm</option>
                            <option value="a2">A2 — 42 × 59.4 cm</option>
                            <option value="a1">A1 — 59.4 × 84.1 cm</option>
                            <option value="a0">A0 — 84.1 × 118.9 cm</option>
                        </optgroup>
                        <optgroup label="Office">
                            <option value="letter">Letter — 21.59 × 27.94 cm</option>
                            <option value="legal">Legal — 21.59 × 35.56 cm</option>
                            <option value="tabloid">Tabloid — 27.94 × 43.18 cm</option>
                        </optgroup>
                        <optgroup label="Photo / Print">
                            <option value="11x17">11 × 17 inch — 27.94 × 43.18 cm</option>
                            <option value="12x18">12 × 18 inch — 30.48 × 45.72 cm</option>
                            <option value="13x19">13 × 19 inch — 33.02 × 48.26 cm</option>
                        </optgroup>
                        <optgroup label="Custom">
                            <option value="custom">Custom Size</option>
                        </optgroup>
                    </select>
                </div>
                <div class="control-group" id="customSizeGroup" style="display:none;">
                    <label>Width</label>
                    <input type="number" id="customWidth" value="21" min="1" max="200" step="0.1">
                    <label>Height</label>
                    <input type="number" id="customHeight" value="29.7" min="1" max="200" step="0.1">
                    <label>Unit</label>
                    <select id="customUnit">
                        <option value="mm">mm</option>
                        <option value="cm" selected>cm</option>
                        <option value="inch">inch</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Paper Orientation</label>
                    <div class="toggle-group">
                        <button class="toggle-btn active" data-value="portrait" id="paperPortraitBtn">Portrait</button>
                        <button class="toggle-btn" data-value="landscape" id="paperLandscapeBtn">Landscape</button>
                    </div>
                </div>
                <div class="control-group">
                    <label>Polaroid Orientation</label>
                    <div class="toggle-group">
                        <button class="toggle-btn active" data-value="portrait" id="polaroidPortraitBtn">Portrait</button>
                        <button class="toggle-btn" data-value="landscape" id="polaroidLandscapeBtn">Landscape</button>
                    </div>
                </div>
            </section>

            <section class="panel">
                <h3>Layout</h3>
                <div class="control-group">
                    <label>Spacing</label>
                    <select id="spacing">
                        <option value="0">0 cm</option>
                        <option value="0.2">0.2 cm</option>
                        <option value="0.3" selected>0.3 cm</option>
                        <option value="0.5">0.5 cm</option>
                        <option value="1">1 cm</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>
                        <input type="checkbox" id="uniformMargin" checked>
                        Uniform Margin
                    </label>
                </div>
                <div class="control-group" id="uniformMarginGroup">
                    <label>Margin</label>
                    <select id="uniformMarginValue">
                        <option value="0">0 cm</option>
                        <option value="0.2">0.2 cm</option>
                        <option value="0.5" selected>0.5 cm</option>
                        <option value="1">1 cm</option>
                        <option value="2">2 cm</option>
                    </select>
                </div>
                <div class="control-group" id="advancedMarginGroup" style="display:none;">
                    <div class="margin-grid">
                        <div>
                            <label>Top</label>
                            <input type="number" id="marginTop" value="0.5" min="0" max="5" step="0.1">
                        </div>
                        <div>
                            <label>Bottom</label>
                            <input type="number" id="marginBottom" value="0.5" min="0" max="5" step="0.1">
                        </div>
                        <div>
                            <label>Left</label>
                            <input type="number" id="marginLeft" value="0.5" min="0" max="5" step="0.1">
                        </div>
                        <div>
                            <label>Right</label>
                            <input type="number" id="marginRight" value="0.5" min="0" max="5" step="0.1">
                        </div>
                    </div>
                </div>
                <div class="control-group">
                    <label>
                        <input type="checkbox" id="cutMarks">
                        Cut Marks
                    </label>
                </div>
            </section>

            <section class="panel">
                <h3>Style</h3>
                <div class="control-group">
                    <label>Background Color</label>
                    <input type="color" id="bgColor" value="#ffffff">
                    <div class="presets">
                        <button class="preset" data-color="#ffffff" title="White">White</button>
                        <button class="preset" data-color="#f5f0e6" title="Cream">Cream</button>
                        <button class="preset" data-color="#000000" title="Black">Black</button>
                        <button class="preset" data-color="#fce4ec" title="Light pink">Pink</button>
                        <button class="preset" data-color="#e3f2fd" title="Light blue">Blue</button>
                    </div>
                </div>
            </section>

            <section class="panel">
                <h3>Text</h3>
                <div class="control-group">
                    <label>
                        <input type="checkbox" id="applyTextToAll">
                        Apply same text to all photos
                    </label>
                </div>
                <div class="control-group">
                    <label>Text</label>
                    <input type="text" id="polaroidText" placeholder="Enter text...">
                </div>
                <div class="control-group">
                    <label>Font Size</label>
                    <input type="number" id="fontSize" value="16" min="8" max="72" step="1">
                </div>
                <div class="control-group">
                    <label>Font</label>
                    <select id="fontFamily">
                        <option value="Arial">Arial</option>
                        <option value="Helvetica">Helvetica</option>
                        <option value="Times New Roman">Times New Roman</option>
                        <option value="Georgia">Georgia</option>
                        <option value="Courier New">Courier New</option>
                        <option value="Verdana">Verdana</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Alignment</label>
                    <select id="textAlign">
                        <option value="center" selected>Center</option>
                        <option value="left">Left</option>
                        <option value="right">Right</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Text Color</label>
                    <input type="color" id="textColor" value="#000000">
                </div>
            </section>
        </aside>

        <main class="main">
            <section class="panel photos-panel">
                <h3>Uploaded Photos</h3>
                <div class="upload-area" id="dropZone">
                    <label class="upload-btn">
                        📷 Add Photos
                        <input type="file" id="photoInput" accept="image/jpeg,image/png,image/webp" multiple hidden>
                    </label>
                    <p class="hint">Drag & drop or click to upload<br>JPG, PNG, WEBP</p>
                </div>
                <div id="photoList"></div>
            </section>
        </main>

        <aside class="sidebar sidebar-preview">
            <div class="preview-header">
                <h3>Print Preview</h3>
                <span id="layoutInfo">A4 — 0 × 0 — 0 polaroids</span>
            </div>
            <div class="preview-container">
                <div id="paper"></div>
            </div>
        </aside>
    </div>

    <div id="cropModal" class="crop-modal">
        <div class="crop-modal-backdrop"></div>
        <div class="crop-modal-content">
            <div class="crop-modal-header">
                <h3>Crop Photo</h3>
                <button class="close-modal" id="closeCropModal">×</button>
            </div>
            <div class="crop-editor">
                <div class="crop-frame" id="cropFrame">
                    <canvas id="cropCanvas"></canvas>
                    <div class="crop-overlay"></div>
                </div>
            </div>
            <div class="crop-controls">
                <div class="zoom-controls">
                    <button id="zoomOutBtn">−</button>
                    <button id="zoomResetBtn">Reset</button>
                    <button id="zoomInBtn">+</button>
                </div>
                <div class="rotate-controls">
                    <button id="rotateLeftBtn" title="Rotate left">↺</button>
                    <button id="rotateRightBtn" title="Rotate right">↻</button>
                </div>
                <div class="crop-actions">
                    <button class="secondary" id="cancelCropBtn">Cancel</button>
                    <button id="applyCropBtn">Apply Crop</button>
                </div>
            </div>
        </div>
    </div>

    <div id="textModal" class="crop-modal">
        <div class="crop-modal-backdrop"></div>
        <div class="crop-modal-content">
            <div class="crop-modal-header">
                <h3>Edit Text</h3>
                <button class="close-modal" id="closeTextModal">×</button>
            </div>
            <div class="text-form">
                <div class="control-group">
                    <label>Text</label>
                    <input type="text" id="editPhotoText" placeholder="Enter text...">
                </div>
                <div class="control-group">
                    <label>Font Size</label>
                    <input type="number" id="editFontSize" value="16" min="8" max="72" step="1">
                </div>
                <div class="control-group">
                    <label>Font</label>
                    <select id="editFontFamily">
                        <option value="Arial">Arial</option>
                        <option value="Helvetica">Helvetica</option>
                        <option value="Times New Roman">Times New Roman</option>
                        <option value="Georgia">Georgia</option>
                        <option value="Courier New">Courier New</option>
                        <option value="Verdana">Verdana</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Alignment</label>
                    <select id="editTextAlign">
                        <option value="center" selected>Center</option>
                        <option value="left">Left</option>
                        <option value="right">Right</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Text Color</label>
                    <input type="color" id="editTextColor" value="#000000">
                </div>
                <div class="crop-actions">
                    <button class="secondary" id="cancelTextBtn">Cancel</button>
                    <button id="applyTextBtn">Apply Text</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
